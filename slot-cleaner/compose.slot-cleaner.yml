services:
  slot-cleaner:
    profiles:
      - clean
    image: alpine:latest
    container_name: slot-cleaner
    restart: unless-stopped
    environment:
      - SLOT_SCHEMA=${SLOT_SCHEMA:-auto}
    volumes:
      - /root/docker/llama-server/slot-cleaner/slot-cleaner.sh:/slot-cleaner.sh:ro
    command: sh /slot-cleaner.sh
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/slot-cleaner-heartbeat && kill -0 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s